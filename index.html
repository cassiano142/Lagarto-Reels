.ttb{width:auto;border:0;border-radius:99px;padding:5px 12px;font:inherit;font-size:12px;font-weight:700;color:#fff;background:var(--c);cursor:pointer;white-space:nowrap}
.ttb.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ac)}
.ttb.lk{opacity:.4;cursor:default}
/* ===== VERSÃO PARA COMPUTADOR (telas largas) — não afeta o celular ===== */
@media (min-width:900px) and (hover:hover){
  body{padding-left:240px}
  body::before{display:none}
  .wrap{max-width:640px;padding-bottom:40px}
  header.top{padding:14px 18px;justify-content:flex-end}
  header.top .logo{display:none}
  .stories{scrollbar-width:thin;gap:16px;padding:14px 18px}
  .chips{padding:12px 18px}
  .post{border:1px solid var(--bd);border-radius:14px;margin:14px 0;background:var(--bg);overflow:hidden}
  .md{border-radius:0}
  .md img,.md video{max-height:80vh}
  .grid{gap:4px}
  .gi{cursor:pointer}
  .ic,.btn,.chip,.mit,nav.bar button{cursor:pointer}
  .ac .ic:hover,.ph .ic:hover{background:var(--card)}
  .chip:hover{filter:brightness(.96)}

  /* menu lateral (no lugar da barra de baixo) */
  nav.bar,body.chat nav.bar,body.rv nav.bar{
    display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;gap:6px;
    top:0;bottom:0;left:0;right:auto;width:240px;padding:84px 14px 20px;
    background:var(--bg);color:var(--fg);border-top:0;border-right:1px solid var(--bd)}
  nav.bar::before{content:"";position:absolute;top:22px;left:20px;width:36px;height:36px;
    background:url(logo.png) center/contain no-repeat}
  nav.bar::after{content:"Lagarto Reels";position:absolute;top:26px;left:64px;font-size:19px;font-weight:800;
    background:linear-gradient(90deg,var(--ac),#f5c518);-webkit-background-clip:text;background-clip:text;color:transparent}
  nav.bar button,body.rv nav.bar button{width:100%;height:50px;justify-content:flex-start;gap:16px;padding:0 16px;
    border-radius:14px;color:var(--fg);opacity:.85;background:none;box-shadow:none}
  nav.bar button::after{content:attr(aria-label);font-size:16px;font-weight:600}
  nav.bar button:hover,body.rv nav.bar button:hover{background:var(--card);opacity:1}
  nav.bar button.on,body.rv nav.bar button.on{color:var(--ac);opacity:1;background:color-mix(in srgb,var(--ac) 15%,transparent)}
  nav.bar button.add,body.rv nav.bar button.add{width:100%;margin-top:10px;color:#fff;opacity:1;
    background:linear-gradient(135deg,var(--ac),#f5c518);box-shadow:0 4px 12px color-mix(in srgb,var(--ac) 40%,transparent)}
  nav.bar button.add::after{font-weight:800}

  /* Reels: coluna central alta, como no Instagram web */
  .rl{left:240px;right:0;bottom:0;max-width:440px;margin:0 auto;border-radius:0}
  .rt{left:240px;right:0;max-width:440px;margin:0 auto}
  body.rv .wrap{max-width:none}

  /* Chat */
  .cin2{left:240px;right:0;max-width:700px;margin:0 auto}
  body.chat .wrap{max-width:700px}

  /* Janelas (modais) no centro da tela, não coladas embaixo */
  .mo{align-items:center}
  .mb{max-width:540px;border-radius:18px;padding-bottom:16px}
  .acsh{border-radius:18px;bottom:50%;transform:translateY(50%);max-height:80vh}
  .toast{bottom:40px}
  :root[data-theme="vice"] body::after{display:none}
}
/* telas muito grandes: um pouco mais de espaço */
@media (min-width:1500px) and (hover:hover){
  .wrap{max-width:700px}
  .rl,.rt{max-width:470px}
}
