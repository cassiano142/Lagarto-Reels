function small(f,max=640){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);const u=c.toDataURL('image/jpeg',.7);u.length>190000?no(new Error('Imagem grande demais.')):ok(u)};i.onerror=()=>no(new Error('Imagem inválida.'));i.src=URL.createObjectURL(f)})}

function fillEx(){
  const k=q.trim().toLowerCase();
  const chips=`<div class="chips">${[['all','Tudo'],['img','📷 Fotos'],['vid','🎬 Reels']].map(c=>`<button class="chip ${ef===c[0]?'on':''}" data-a="exf" data-id="${c[0]}">${c[1]}</button>`).join('')}</div>`;
  const okT=p=>ef==='all'||(ef==='vid'?p.type==='video':p.type!=='video');
  let h=chips;
  if(!k){
    const l=POSTS.filter(okT);
    h+=l.length?`<div class="grid">${l.map(gi).join('')}</div>`:`<div class="empty">${ef==='vid'?'Ainda não há reels.':ef==='img'?'Ainda não há fotos.':'Nada para explorar ainda.'}</div>`;
  }else{
    const people=ef==='all'?Object.keys(P).filter(u=>!hid(u)&&((P[u].name||'').toLowerCase().includes(k)||(P[u].bio||'').toLowerCase().includes(k))):[];
    const found=POSTS.filter(p=>okT(p)&&(p.cap||'').toLowerCase().includes(k));
    if(people.length)h+=`<p class="mut" style="padding:4px 14px 0"><b>Pessoas</b></p>`+people.map(u=>`<a class="cm" data-a="prof" data-id="${esc(u)}" style="padding:8px 14px">${av(u)}<div><b>${esc(P[u].name)}${vb(u)}</b><div class="mut">${esc(P[u].bio||'')}</div></div></a>`).join('');
    const imgs=found.filter(p=>p.type!=='video'),vids=found.filter(p=>p.type==='video');
    if(imgs.length)h+=`<p class="mut" style="padding:10px 14px 4px"><b>📷 Fotos</b></p><div class="grid">${imgs.map(gi).join('')}</div>`;
    if(vids.length)h+=`<p class="mut" style="padding:10px 14px 4px"><b>🎬 Reels</b></p><div class="grid">${vids.map(gi).join('')}</div>`;
    if(!people.length&&!found.length)h+='<div class="empty">Nada encontrado para “'+esc(q.trim())+'”.</div>';
  }
  $('#exr').innerHTML=h;
}

function modal(h){$('#mbody').innerHTML=h;$('#mo').hidden=false}

function fillPost(){
  const p=POSTS.find(x=>x.id===openP);if(!p||$('#mo').hidden){if(!p)closeM();return}
  $('#mcard').innerHTML=card(p);
  $('#cl').innerHTML=CM.filter(c=>c.pid===openP).sort((a,b)=>a.ts-b.ts).map(c=>`<div class="cm"><a data-a="prof" data-id="${esc(c.uid)}">${av(c.uid,'s')}</a><div><b>${esc(nm(c.uid))}${vb(c.uid)}</b> ${esc(c.text)}<div class="mut">${ago(c.ts)}${c.uid===me?` · <a data-a="delc" data-id="${c.id}">excluir</a>`:''}</div></div></div>`).join('')||'<p class="mut">Nenhum comentário ainda. Seja o primeiro!</p>';

function send(){const i=$('#ci'),t=i.value.trim();if(!t||!need())return;i.value='';w(db.collection('comments').add({pid:openP,uid:me,text:t,ts:Date.now()}))}
function newPost(rl){if(!need())return;pfile=null;
  modal(`<h3>${rl?'Novo reel':'Nova publicação'}</h3><div class="cams">${rl?'':`<label class="drop s">${I('camera',22)}<span>Tirar foto</span><input type="file" class="pin" accept="image/*" capture="environment"></label>`}<label class="drop s">${I('reels',22)}<span>Gravar vídeo</span><input type="file" class="pin" accept="video/*" capture="environment"></label><label class="drop s">${I('upload',22)}<span>Escolher da galeria</span><input type="file" class="pin" accept="${rl?'video/*':'image/*,video/*'}"></label></div><div id="pv"></div><textarea id="pc" rows="3" maxlength="300" placeholder="Escreva uma legenda…"></textarea><button class="btn" id="pg" data-a="publish">Publicar</button><div id="ps" class="mut"></div>`);
  document.querySelectorAll('.pin').forEach(inp=>inp.onchange=e=>{const f=e.target.files[0];if(!f)return;pfile=f;const u=URL.createObjectURL(f);$('#pv').innerHTML=f.type.startsWith('video/')?`<video src="${u}" controls playsinline></video>`:`<img src="${u}" alt="">`;$('#ps').textContent=''})}
async function publish(){
  const f=pfile,st=$('#ps');if(!f){st.textContent='Tire uma foto, grave um vídeo ou escolha da galeria.';return}
  if(f.size>50*1048576){st.textContent='Arquivo acima de 50 MB.';return}
  $('#pg').disabled=true;st.textContent='Enviando…';
  try{const url=await up(f),isV=f.type.startsWith('video/');await db.collection('posts').add({uid:me,url,type:isV?'video':'image',cap:$('#pc').value.trim(),ts:Date.now()});closeM();tab=isV?'reels':'home';render();toast('Publicado! 🦎')}
  catch(e){console.error(e);st.textContent=(e&&e.message)||'Falha ao enviar.';$('#pg').disabled=false}
}

async function saveProf(){

  if(n.length<2){st.textContent='Escolha um nome com pelo menos 2 letras.';return}
  if(Object.keys(P).some(u=>u!==me&&P[u].name.toLowerCase()===n.toLowerCase())){st.textContent='Esse nome já está em uso.';return}
  $('#sp').disabled=true;st.textContent='Salvando…';

  let o=$('#call');if(!CALL){if(o)o.remove();return}
  if(!o){o=document.createElement('div');o.id='call';document.body.append(o)}
  const c=CALL,st=c.st==='in'?'Chamada de voz do Lagarto Reels':c.st==='out'?'Chamando…':c.st==='conn'?'Conectando…':fmtD(c.sec||0);
  o.innerHTML=`${av(c.peer)}<h2>${esc(nm(c.peer))}</h2><p>${st}</p><div class="cbt">`+(c.st==='in'?`<button class="cbn rd" data-a="cend" aria-label="Recusar">${I('phone',28)}</button><button class="cbn gr" data-a="cacc" aria-label="Atender">${I('phone',28)}</button>`:`<button class="cbn ${c.mute?'wh':''}" data-a="cmute" aria-label="Silenciar">${I(c.mute?'micx':'mic',26)}</button><button class="cbn rd" data-a="cend" aria-label="Desligar">${I('phone',28)}</button>`)+`</div>`;
}
function mkPc(){
  const c=CALL,pc=c.pc=new RTCPeerConnection(ICE);
  pc.onicecandidate=e=>{if(e.candidate)sig(c.peer,'ice',e.candidate,c.cid)};
  pc.ontrack=e=>{let a=$('#rau');if(!a){a=document.createElement('audio');a.id='rau';a.autoplay=true;a.setAttribute('playsinline','');document.body.append(a)}a.srcObject=e.streams[0];a.play().catch(()=>{})};
  pc.onconnectionstatechange=()=>{if(CALL!==c)return;const s=pc.connectionState;
    if(s==='connected'&&c.st!=='on'){c.st='on';c.t0=Date.now();c.sec=0;c.tk=setInterval(()=>{c.sec=Math.floor((Date.now()-c.t0)/1e3);callUI()},1000);callUI()}
    else if(s==='failed'||s==='closed')callEnd(true,'A chamada caiu.')};
}
async function startCall(peer){
  if(!need())return;if(CALL){toast('Você já está em uma chamada.');return}
  if(!navigator.mediaDevices||!window.RTCPeerConnection){toast('Seu navegador não suporta chamadas.');return}
  let ms;try{ms=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}catch(e){toast('Permita o microfone para ligar.');return}
  const c=CALL={peer,cid:me+Date.now(),st:'out',ms,mine:true,ice:[]};
  mkPc();ms.getTracks().forEach(t=>c.pc.addTrack(t,ms));
  const o=await c.pc.createOffer();await c.pc.setLocalDescription(o);
  sig(peer,'offer',o,c.cid);callUI();
  c.to=setTimeout(()=>{if(CALL===c&&c.st==='out')callEnd(true,'Ninguém atendeu.')},45000);
}
async function onSig(p){
  if(!p||p.to!==me)return;const c=CALL;
  if(p.type==='offer'){
    if(c){sig(p.from,'busy',null,p.cid);return}
    CALL={peer:p.from,cid:p.cid,st:'in',offer:p.d,ice:[],mine:false};callUI();
    if(navigator.vibrate)navigator.vibrate([400,200,400,200,400]);
    if(document.hidden&&window.Notification&&Notification.permission==='granted')try{new Notification('Chamada de voz',{body:nm(p.from)+' está ligando',icon:'icon-192.png'})}catch(e){}
    return}
  if(!c||p.cid!==c.cid)return;
  if(p.type==='answer'&&c.pc){clearTimeout(c.to);c.st='conn';await c.pc.setRemoteDescription(p.d);for(const x of c.ice)c.pc.addIceCandidate(x).catch(()=>{});c.ice=[];callUI()}
  else if(p.type==='ice'){if(c.pc&&c.pc.remoteDescription)c.pc.addIceCandidate(p.d).catch(()=>{});else c.ice.push(p.d)}
  else if(p.type==='end')callEnd(false,'Chamada encerrada.');
  else if(p.type==='busy')callEnd(false,'Está em outra chamada.');
}
async function callAcc(){
  const c=CALL;if(!c||c.st!=='in')return;
  let ms;try{ms=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}catch(e){toast('Permita o microfone para atender.');callEnd(true,'');return}
  if(navigator.vibrate)navigator.vibrate(0);
  c.ms=ms;c.st='conn';mkPc();ms.getTracks().forEach(t=>c.pc.addTrack(t,ms));
  await c.pc.setRemoteDescription(c.offer);for(const x of c.ice)c.pc.addIceCandidate(x).catch(()=>{});c.ice=[];
  const a=await c.pc.createAnswer();await c.pc.setLocalDescription(a);sig(c.peer,'answer',a,c.cid);callUI();
}
function callEnd(notify,note){
  const c=CALL;if(!c)return;CALL=null;clearTimeout(c.to);clearInterval(c.tk);
  if(notify)sig(c.peer,'end',null,c.cid);
  try{if(c.pc)c.pc.close()}catch(e){}
  if(c.ms)c.ms.getTracks().forEach(t=>t.stop());
  const a=$('#rau');if(a)a.remove();if(navigator.vibrate)navigator.vibrate(0);
  if(c.mine)w(db.collection('messages').add({from:me,to:c.peer,text:'',k:'c',d:c.t0?Math.round((Date.now()-c.t0)/1e3):0,ts:Date.now()}));
  callUI();if(note)toast(note);
}
function keep(){['e','p','c'].forEach(k=>{const i=$('#a'+(k==='e'?'e':k==='p'?'p':'c'));if(i)AU[k]=k==='p'?i.value:i.value.trim()})}
function authGo(){keep();AU.s={e:'login',p:'e',c:'p',done:'login'}[AU.s]||'login';authView()}
async function authNext(){
  keep();const s=AU.s,m=$('#am'),e=AU.e,p=AU.p,er=t=>{m.textContent=t};
  if(s==='login'){
    if(!e||!p)return er('Preencha o e-mail e a senha.');er('Aguarde…');
    const r=await sb.auth.signInWithPassword({email:e,password:p});
    if(r.error)return er(/Invalid login/i.test(r.error.message)?'E-mail ou senha incorretos.':/not confirmed/i.test(r.error.message)?'Confirme seu e-mail antes de entrar.':r.error.message);
    return location.reload();
  }
  if(s==='e'){if(!/^\S+@\S+\.\S+$/.test(e))return er('Digite um e-mail válido.');AU.s='p';return authView()}
  if(s==='p'){if(p.length<6)return er('A senha precisa ter pelo menos 6 caracteres.');AU.s='c';return authView()}
  if(s==='c'){
    if(!AU.c)return er('Digite o código da rua.');er('Criando sua conta…');
    const r=await sb.auth.signUp({email:e,password:p,options:{data:{codigo:AU.c}}});
    if(r.error)return er(/Database error/i.test(r.error.message)?'Código da rua incorreto.':/registered/i.test(r.error.message)?'Esse e-mail já tem conta. Toque em "Já tenho uma conta".':r.error.message);
    if(!r.data.session){AU.s='done';return authView()}
    location.reload();
  }
}
function start(){
  const sub=(c,f)=>db.collection(c).onSnapshot(s=>{f(s.docs.map(d=>Object.assign({id:d.id},dd(d))));sched()});
  sub('profiles',a=>{P={};a.forEach(x=>P[x.id]=x);vis();if(!ready){ready=true;clearTimeout(tmr);if(me&&!P[me])onboard()}});
  initCalls();sub('posts',a=>{RAW.p=a;vis()});
  sub('likes',a=>{RAW.l=a;vis()});sub('comments',a=>{RAW.c=a;vis()});sub('follows',a=>{RAW.f=a;vis()});sub('saves',a=>SV=a);sub('messages',a=>MS=a);sub('verified',a=>VF=a);
  tmr=setTimeout(()=>{if(!ready){ready=true;render()}},10000);
}
(async()=>{
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  const{data}=await sb.auth.getSession();
  if(!data.session){authView();$('#auth').style.display='flex';return}
  me=data.session.user.id;myEmail=data.session.user.email||'';try{rmute=localStorage.getItem('rsnd')==='0'}catch(e){}start();
})();
