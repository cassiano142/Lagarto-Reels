function keep(){['e','p','c'].forEach(k=>{const i=$('#a'+(k==='e'?'e':k==='p'?'p':'c'));if(i)AU[k]=k==='p'?i.value:i.value.trim()})}
function authGo(){keep();AU.s={e:'login',p:'e',c:'p',done:'login'}[AU.s]||'login';authView()}
async function authNext(){
  keep();const s=AU.s,m=$('#am'),e=AU.e,p=AU.p,er=t=>{m.textContent=t};
  if(s==='login'){
    if(!e||!p)return er('Preencha o e-mail e a senha.');er('Aguarde…');
    const r=await sb.auth.signInWithPassword({email:e,password:p});
    if(r.error)return er(/Invalid login/i.test(r.error.message)?'E-mail ou senha incorretos.':/not confirmed/i.test(r.error.message)?'Confirme seu e-mail antes de entrar.':r.error.message);
    return location.reload();
  }
  if(s==='e'){if(!/^\S+@\S+\.\S+$/.test(e))return er('Digite um e-mail válido.');AU.s='p';return authView()}
  if(s==='p'){if(p.length<6)return er('A senha precisa ter pelo menos 6 caracteres.');AU.s='c';return authView()}
  if(s==='c'){
    if(!AU.c)return er('Digite o código da rua.');er('Criando sua conta…');
    const r=await sb.auth.signUp({email:e,password:p,options:{data:{codigo:AU.c}}});
    if(r.error)return er(/Database error/i.test(r.error.message)?'Código da rua incorreto.':/registered/i.test(r.error.message)?'Esse e-mail já tem conta. Toque em "Já tenho uma conta".':r.error.message);
    if(!r.data.session){AU.s='done';return authView()}
    location.reload();
  }
}
/* ===== GRUPOS ===== */
let GS={step:1,name:'',file:null,prev:'',sel:new Set()};
function gNew(){if(!need())return;GS={step:1,name:'',file:null,prev:'',sel:new Set()};gStep()}
function gClose(){const e=$('#gfl');e.hidden=true;e.innerHTML='';e.classList.remove('gx');document.body.classList.remove('gfo')}
function gStep(){const e=$('#gfl'),s=GS.step,ok=GS.name.trim().length>=2;e.hidden=false;document.body.classList.add('gfo');
  const back='<button class="gback" data-a="gback" aria-label="Voltar">←</button>';
  if(s===1)e.innerHTML=back+`<div class="gbody"><h2>Crie um nome para o grupo</h2><p class="mut">Escolha um nome que todos reconheçam.</p><div class="gfld"><label for="gnm">Nome do grupo</label><input id="gnm" maxlength="40" value="${esc(GS.name)}" autocomplete="off" oninput="gName(this)"><span id="gok" class="gok" ${ok?'':'hidden'}>✓</span></div><button class="btn" id="gnx" data-a="gnext" ${ok?'':'disabled'}>Avançar</button></div>`;
  else if(s===2)e.innerHTML=back+`<div class="gbody"><h2>Adicione uma foto do grupo</h2><p class="mut">Adicione uma foto para que os membros reconheçam o grupo. Todos os membros poderão ver a foto.</p><label class="gph" for="gpf">${GS.prev?`<img src="${GS.prev}" alt="">`:'<span class="gsil">👥</span>'}</label><input type="file" id="gpf" accept="image/*" hidden onchange="gPhoto(this)"></div><div class="gfoot"><label class="btn" for="gpf">${GS.prev?'Trocar foto':'Adicionar foto'}</label><button class="btn g" style="margin-top:8px;background:var(--card);color:var(--fg)" data-a="gnext">${GS.prev?'Avançar':'Pular'}</button></div>`;
  else{e.innerHTML=back+`<div class="gbody"><h2>Adicione pessoas ao grupo</h2><p class="mut">Escolha quem vai participar. Quem você segue aparece primeiro.</p><input class="sr" id="gq" placeholder="Buscar pessoas…" oninput="gList()" style="width:100%;margin:0 0 6px"><div id="gl"></div><p class="mut" id="gm" style="text-align:center;min-height:18px"></p></div><div class="gfoot"><button class="btn" data-a="gcreate">Criar grupo</button></div>`;gList()}
  if(s===1){const i=$('#gnm');if(i)setTimeout(()=>i.focus(),50)}}
function gName(i){GS.name=i.value;const ok=i.value.trim().length>=2,k=$('#gok'),b=$('#gnx');if(k)k.hidden=!ok;if(b)b.disabled=!ok}
function gPhoto(i){const f=i.files&&i.files[0];if(!f)return;if(GS.prev)try{URL.revokeObjectURL(GS.prev)}catch(e){}GS.file=f;GS.prev=URL.createObjectURL(f);gStep()}
function gList(){const q=($('#gq')?$('#gq').value:'').toLowerCase(),cur=GS.add?((gOf(GS.add)||{}).members||[]):[];
  const us=Object.keys(P).filter(u=>u!==me&&!cur.includes(u)&&(P[u].name||'').toLowerCase().includes(q)).sort((a,b)=>amF(b)-amF(a));
  $('#gl').innerHTML=us.length?us.map(u=>`<a class="cm" data-a="gsel" data-id="${esc(u)}" style="padding:8px 4px;align-items:center">${av(u)}<div style="flex:1;min-width:0"><b>${esc(nm(u))}${vb(u)}</b>${amF(u)?'<div class="mut" style="font-size:12px">Você segue</div>':''}</div><span class="gck rd ${GS.sel.has(u)?'on':''}"></span></a>`).join(''):'<div class="empty">Ninguém encontrado.</div>'}
async function gCreate(){const m=$('#gm'),n=GS.name.trim();
  if(!GS.sel.size){m.textContent='Escolha pelo menos 1 pessoa.';return}if(GS.sel.size>49){m.textContent='Máximo de 50 pessoas.';return}
  const gid=crypto.randomUUID();m.textContent='Criando…';let a='👥';
  if(GS.file){try{a=await up(await shrink(GS.file))}catch(e){console.error(e);toast('Não consegui enviar a foto; usei o ícone padrão.')}}
  try{chk(await sb.from('docs').insert({col:'groups',id:gid,data:{name:n,av:a,members:[me].concat([...GS.sel]),by:me,ts:Date.now()}}));if(RL.groups)await RL.groups();gClose();cu='g_'+gid;lastN=-1;tab='chat';render()}
  catch(e){console.error(e);m.textContent='Não foi possível criar o grupo. Confira se o SQL dos grupos foi rodado.'}}

let GI=null;
function gShow(){const e=$('#gfl');e.classList.add('gx');e.hidden=false;document.body.classList.add('gfo');return e}
function gInfo(id){const g=gOf(id);if(!g)return;GI=id;const own=g.by===me,ms=g.members||[],mu=gmut(id),e=gShow();
  const img=/^(https?:|\/_blob|data:)/.test(g.av||''),two=!img&&ms.length>1;
  const act=(a,ic,t,on)=>`<button data-a="${a}" data-id="${esc(id)}" class="${on?'on':''}">${I(ic,26)}<span>${t}</span></button>`;
  e.innerHTML=`<div class="gtop"><button class="gback" data-a="gx" aria-label="Voltar">${I('back',24)}</button></div><div class="gbd"><div class="gpa ${two?'two':''}">${two?av(ms[0],'l')+av(ms[1],'l'):av(id,'l')}</div><div class="gnm">${esc(g.name)}</div>${own?`<a class="glk" data-a="gedit" data-id="${esc(id)}">Alterar nome e foto</a>`:`<div class="mut" style="text-align:center">${ms.length} pessoas</div>`}<div class="gacts">${own?act('gadd','userplus','Adicionar'):''}${act('gsrch','search','Pesquisar')}${act('gmute',mu?'bellx':'bell',mu?'Silenciado':'Silenciar',mu)}${act('gleave','exit','Sair')}</div><div id="gmsw" hidden><input class="sr" id="gmq" placeholder="Pesquisar nas mensagens" oninput="gMs()" autocomplete="off"><div id="gmr"></div></div><button class="grw" data-a="gppl"><span style="width:26px;display:flex">${I('users',24)}</span><div class="t"><b>Pessoas</b><small>${esc(ms.map(nm).join(', '))}</small></div><span class="ch">›</span></button><div id="gpl" hidden>${ms.map(u=>`<div class="cm" style="padding:8px 18px;align-items:center"><a data-a="prof" data-id="${esc(u)}" style="display:flex;align-items:center;gap:10px;flex:1;min-width:0">${av(u)}<div><b>${esc(nm(u))}${vb(u)}</b>${u===g.by?'<div class="mut" style="font-size:12px">Criador</div>':''}</div></a>${own&&u!==me?`<button class="lnk" data-a="grm" data-id="${esc(id)}" data-u="${esc(u)}">Remover</button>`:''}</div>`).join('')}</div>${own?`<button class="grw" style="color:#ed4956" data-a="gdel" data-id="${esc(id)}"><span style="width:26px;display:flex">${I('trash',24)}</span><b>Excluir grupo</b></button>`:''}</div>`}
function gMs(){const o=$('#gmr'),q=(($('#gmq')||{}).value||'').trim().toLowerCase();if(!o)return;if(!q){o.innerHTML='';return}
  const r=conv(GI).filter(m=>m.text&&m.text.toLowerCase().includes(q)).reverse().slice(0,30);
  o.innerHTML=r.length?r.map(m=>`<a class="grw" data-a="gx" style="padding:10px 18px"><div class="t"><b>${esc(nm(m.from))}</b><span>${esc(m.text)}</span><small>${ago(m.ts)}</small></div></a>`).join(''):'<div class="empty" style="padding:24px">Nenhuma mensagem encontrada.</div>'}
function gChips(){const c=$('#gch');if(c)c.innerHTML=[...GS.sel].map(u=>`<b data-a="gsel" data-id="${esc(u)}">${esc(nm(u))}</b>`).join('')}
function gAdd(id){GS={add:id,sel:new Set()};const e=gShow();
  e.innerHTML=`<div class="gtop"><button class="gback" data-a="ginfo" data-id="${esc(id)}" aria-label="Voltar">${I('back',24)}</button><b style="font-size:18px">Adicionar pessoas</b><button class="lnk" style="margin-left:auto;font-weight:700;color:var(--ac)" data-a="gaddok">Concluir</button></div><div class="gto"><span class="mut">Para:</span><span class="gch" id="gch"></span><input id="gq" placeholder="Pesquisar" oninput="gList()" autocomplete="off"></div><p class="mut" id="gm" style="text-align:center;min-height:18px;margin:6px 0 0"></p><div class="gbd"><div id="gl"></div></div>`;gList()}
function gEdit(id){const g=gOf(id);if(!g)return;GS={ed:id,name:g.name||'',file:null,prev:''};const e=gShow(),img=/^(https?:|\/_blob|data:)/.test(g.av||'');
  e.innerHTML=`<div class="gtop"><button class="gback" data-a="ginfo" data-id="${esc(id)}" aria-label="Voltar">${I('back',24)}</button><b style="font-size:18px">Alterar nome e foto</b><button class="lnk" style="margin-left:auto;font-weight:700;color:var(--ac)" data-a="gedok" data-id="${esc(id)}">Salvar</button></div><div class="gbd" style="padding:0 18px"><label class="gph" for="gpf" id="gpv" style="width:140px;height:140px;margin-top:20px">${img?`<img src="${esc(g.av)}" alt="">`:'<span class="gsil" style="font-size:60px">👥</span>'}</label><input type="file" id="gpf" accept="image/*" hidden onchange="gEdPhoto(this)"><div style="text-align:center;margin:12px 0 22px"><label class="glk" for="gpf">Trocar foto</label></div><div class="gfld"><label for="gnm">Nome do grupo</label><input id="gnm" maxlength="40" value="${esc(GS.name)}" autocomplete="off" oninput="GS.name=this.value"></div></div>`}
function gEdPhoto(i){const f=i.files&&i.files[0];if(!f)return;GS.file=f;if(GS.prev)try{URL.revokeObjectURL(GS.prev)}catch(e){}GS.prev=URL.createObjectURL(f);const v=$('#gpv');if(v)v.innerHTML=`<img src="${GS.prev}" alt="">`}
async function gEdSave(id){const g=gOf(id);if(!g||!GS||GS.ed!==id)return;const n=(GS.name||'').trim();if(n.length<2){toast('O nome precisa ter pelo menos 2 letras.');return}
  let a=g.av;if(GS.file){toast('Enviando foto…');try{a=await up(await shrink(GS.file))}catch(e){console.error(e);toast('Não consegui enviar a foto.');return}}
  gSave(id,d=>{d.name=n;d.av=a},()=>{toast('Grupo atualizado');gInfo(id)})}
async function gSave(id,fn,ok){const g=gOf(id);if(!g)return;const d=Object.assign({},g);delete d.id;fn(d);
  try{chk(await sb.from('docs').update({data:d}).eq('col','groups').eq('id',g.id));if(RL.groups)await RL.groups();if(ok)ok()}catch(e){console.error(e);toast('Não foi possível salvar o grupo.')}}
async function gLeave(id){if(!confirm('Sair do grupo?'))return;const raw=id.slice(2);
  try{chk(await sb.rpc('sair_do_grupo',{gid:raw}));GR=GR.filter(x=>x.id!==raw);closeM();tab='dm';render();toast('Você saiu do grupo')}catch(e){console.error(e);toast('Não foi possível sair do grupo.')}}
function start(){
  if(window.Notification&&Notification.permission==='granted')pushSub(false);
  const sub=(c,f)=>db.collection(c).onSnapshot(s=>{f(s.docs.map(d=>Object.assign({id:d.id},dd(d))));sched()});
  sub('profiles',a=>{P={};a.forEach(x=>P[x.id]=x);vis();acctRef();{const sg=Object.keys(P).filter(u=>P[u].priv).sort().join();if(sg!==psig){psig=sg;RL.posts&&RL.posts()}}if(!ready){ready=true;clearTimeout(tmr);if(me&&!P[me])onboard()}});
  initCalls();sub('posts',a=>{RAW.p=a;vis()});
  sub('likes',a=>{RAW.l=a;vis()});sub('comments',a=>{RAW.c=a;vis()});sub('follows',a=>{RAW.f=a;vis()});sub('saves',a=>SV=a);sub('messages',a=>MS=a);sub('verified',a=>VF=a);sub('groups',a=>GR=a);sub('notes',a=>NT=a);sub('chatthemes',a=>CT=a);sub('approvals',a=>{APR=a;vis();const sg=a.filter(x=>x.ok&&x.id.endsWith('_'+me)).map(x=>x.id).sort().join();if(sg!==asig){asig=sg;RL.posts&&RL.posts()}});
  tmr=setTimeout(()=>{if(!ready){ready=true;render()}},10000);
