const ls=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}};
const lset=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function applyTheme(){const t=ls('theme','auto'),r=document.documentElement;if(t==='light'||t==='dark')r.dataset.theme=t;else delete r.dataset.theme;r.classList.toggle('bw',ls('bw','0')==='1')}
function settings(cat){
  const t=ls('theme','auto'),n0=me&&P[me]?'@'+esc(P[me].name):'';
  const row=(id,ic,tt,sub)=>`<button class="srw" data-a="scat" data-id="${id}">${I(ic,22)}<span class="t"><b>${tt}</b><small class="mut">${sub}</small></span><em>›</em></button>`;
  const back=ti=>`<button class="lnk" data-a="settings" style="margin-bottom:6px">‹ Configurações</button><h3>${ti}</h3>`;
  const chip=(v,l)=>`<button class="chip ${t===v?'on':''}" data-a="theme" data-id="${v}">${l}</button>`;
  let h;
  if(cat==='look')h=back('Aparência')+`<b>Tema</b><div class="chips" style="padding:8px 0">${chip('auto','Automático')}${chip('light','Claro')}${chip('dark','Escuro')}</div><label class="srow"><input type="checkbox" data-a="bw" ${ls('bw','0')==='1'?'checked':''}> Preto e branco (sem cores)</label>`;
  else if(cat==='acc')h=back('Conta')+`<p class="mut">Conectado como <b>${n0}</b><br>${esc(myEmail)}</p><button class="btn g" data-a="editprof">Editar perfil</button>`;
  else if(cat==='pw')h=back('Senha e segurança')+`<input type="password" id="np" placeholder="Nova senha (mín. 6 caracteres)" autocomplete="new-password"><input type="password" id="np2" placeholder="Repita a nova senha" autocomplete="new-password"><button class="btn" style="margin-top:6px" data-a="chpw">Alterar senha</button><p id="pwm" class="mut"></p>`;
  else if(cat==='reel')h=back('Reels e vídeos')+`<label class="srow"><input type="checkbox" data-a="rsound" ${ls('rsnd','1')==='1'?'checked':''}> Começar os vídeos com som</label>`;
  else if(cat==='about')h=back('Sobre')+`<p><b>Lagarto Reels</b><br>A rede social da nossa rua 🦎</p><p class="mut">Seus posts, curtidas e mensagens ficam guardados na nuvem e você pode entrar de qualquer aparelho.</p>`;
  else h=`<h3>Configurações</h3><p class="mut" style="margin:0 0 6px">Conectado como <b>${n0}</b></p>`+row('look','sun','Aparência','Tema claro, escuro e preto e branco')+row('acc','user','Conta','Perfil e e-mail')+row('pw','lock','Senha e segurança','Alterar a senha')+row('reel','reels','Reels e vídeos','Som ao abrir os vídeos')+row('about','info','Sobre','Lagarto Reels')+`<button class="btn" style="margin-top:18px;background:var(--red);box-shadow:none" data-a="logout">Sair da conta</button>`;
  modal(h);
}
function editProf(first){
  const p=P[me]||{};pav=p.av||'🦎';
  modal(`<h3>${first?'Crie seu perfil 🦎':'Editar perfil'}</h3><div class="emo">${EM.map(e=>`<button class="ic ${e===pav?'on':''}" data-a="emo" data-id="${e}">${e}</button>`).join('')}</div><label class="drop s">${I('image',22)}<span>Ou envie uma foto</span><input type="file" id="af" accept="image/*"></label><input type="text" id="pn" maxlength="24" placeholder="Nome de usuário" value="${esc(p.name||'')}"><textarea id="pbio" rows="2" maxlength="150" placeholder="Bio">${esc(p.bio||'')}</textarea><button class="btn" id="sp" data-a="saveprof">Salvar</button>${first?'':'<button class="btn g" style="margin-top:8px" data-a="logout">Sair da conta</button>'}<div id="ps" class="mut"></div>`);
}
async function saveProf(){
  const n=$('#pn').value.trim().replace(/\s+/g,'_'),st=$('#ps');
  if(n.length<2){st.textContent='Escolha um nome com pelo menos 2 letras.';return}
  if(Object.keys(P).some(u=>u!==me&&P[u].name.toLowerCase()===n.toLowerCase())){st.textContent='Esse nome já está em uso.';return}
  $('#sp').disabled=true;st.textContent='Salvando…';
  try{const f=$('#af').files[0];let a=pav||'🦎';if(f)a=await up(f);
    await db.doc('profiles/'+me).set({name:n,bio:$('#pbio').value.trim(),av:a,ts:(P[me]&&P[me].ts)||Date.now()});closeM();toast('Perfil salvo!')}
  catch(e){console.error(e);st.textContent=(e&&e.message)||'Falha ao salvar.';$('#sp').disabled=false}
}
function pop(el){const s=document.createElement('div');s.className='pop';s.textContent='❤️';el.append(s);setTimeout(()=>s.remove(),700)}
function toggleLike(pid){if(!need())return;const r=db.doc('likes/'+pid+'_'+me);w(liked(pid)?r.delete():r.set({pid,uid:me,ts:Date.now()}))}

document.addEventListener('click',e=>{
  if(e.target.id==='mo'){closeM();return}
  const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,id=t.dataset.id;
  if(a==='dbl'){const n=Date.now();if(n-lastTap<350){lastTap=0;if(!liked(id)){toggleLike(id)}pop(t)}else lastTap=n;return}
  if(a==='rtap'){const n=Date.now();if(n-lastTap<300){lastTap=0;clearTimeout(tapT);if(!liked(id))toggleLike(id);pop(t.parentElement)}else{lastTap=n;tapT=setTimeout(()=>{t.paused?t.play().catch(()=>{}):t.pause()},300)}return}
  if(a==='nav'){closeM();tab=id;vu=null;render();scrollTo(0,0)}
  else if(a==='prof'){closeM();tab='profile';vu=id;pt='posts';render();scrollTo(0,0)}
  else if(a==='chip'){filt=id;render()}
  else if(a==='exf'){ef=id;fillEx()}
  else if(a==='pt'){pt=id;render()}
  else if(a==='rmute'){rmute=!rmute;document.querySelectorAll('.rs video').forEach(v=>v.muted=rmute);t.innerHTML=I(rmute?'mute':'vol',22)}
  else if(a==='newreel')newPost(true);
  else if(a==='notif'){closeM();nview=nseen();setNs(Date.now());tab='notif';if(window.Notification&&Notification.permission==='default')Notification.requestPermission();render();scrollTo(0,0)}
  else if(a==='dm'){tab='dm';render();scrollTo(0,0)}
  else if(a==='chat'){if(!need())return;cu=id;lastN=-1;tab='chat';render()}
  else if(a==='sendm')sendm();
  else if(a==='more'){const p=POSTS.find(x=>x.id===id);t.dataset.a=p&&p.uid===me?'del':'save';t.click()}
  else if(a==='like')toggleLike(id);
  else if(a==='open')openPost(id);
  else if(a==='close')closeM();
  else if(a==='newpost')newPost();
  else if(a==='publish')publish();
  else if(a==='editprof'){if(db&&me)editProf(!P[me])}
  else if(a==='saveprof')saveProf();
  else if(a==='settings')settings();
  else if(a==='scat')settings(id);
  else if(a==='theme'){lset('theme',id);applyTheme();settings('look')}
  else if(a==='bw'){lset('bw',t.checked?'1':'0');applyTheme()}
  else if(a==='rsound'){lset('rsnd',t.checked?'1':'0');rmute=!t.checked}
  else if(a==='chpw'){const p=$('#np').value,p2=$('#np2').value,m=$('#pwm');if(p.length<6){m.textContent='A senha precisa ter pelo menos 6 caracteres.';return}if(p!==p2){m.textContent='As senhas não são iguais.';return}m.textContent='Salvando…';sb.auth.updateUser({password:p}).then(r=>{m.textContent=r.error?r.error.message:'Senha alterada!';if(!r.error){$('#np').value='';$('#np2').value=''}})}
  else if(a==='logout')sb.auth.signOut().then(()=>location.reload());
  else if(a==='emo'){pav=id;document.querySelectorAll('.emo .ic').forEach(b=>b.classList.toggle('on',b.dataset.id===id));$('#af').value=''}
  else if(a==='send')send();
  else if(a==='delc')w(db.doc('comments/'+id).delete());
  else if(a==='share'){const u=location.href;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('Link do app copiado!')).catch(()=>toast('Copie o link na barra do navegador.'))}
  else if(a==='save'){if(!need())return;const r=db.doc('saves/'+id+'_'+me);w(SV.some(s=>s.pid===id&&s.uid===me)?r.delete():r.set({pid:id,uid:me}))}
  else if(a==='follow'){if(!need())return;const r=db.doc('follows/'+me+'_'+id);w(amF(id)?r.delete():r.set({from:me,to:id}))}
  else if(a==='del'){if(pdel===id){pdel=null;w(db.doc('posts/'+id).delete());toast('Publicação excluída')}else{pdel=id;toast('Toque de novo para excluir');setTimeout(()=>pdel=null,4000)}}
});
document.addEventListener('loadedmetadata',e=>{const v=e.target;if(v.matches&&v.matches('.rs video'))v.style.objectFit=v.videoHeight>=v.videoWidth?'cover':'contain'},true);
document.addEventListener('keydown',e=>{if(e.target.id==='cmi'&&e.key==='Enter')sendm()});
document.addEventListener('input',e=>{if(e.target.id==='sq'){q=e.target.value;fillEx()}});

const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const chk=r=>{if(r.error)throw r.error;return r};
db={
  collection:c=>({
    onSnapshot(f){const load=async()=>{const{data}=await sb.from('docs').select('id,data').eq('col',c);f({docs:(data||[]).map(r=>({id:r.id,data:()=>r.data}))})};load();sb.channel('c-'+c).on('postgres_changes',{event:'*',schema:'public',table:'docs',filter:'col=eq.'+c},load).subscribe()},
    add:d=>sb.from('docs').insert({col:c,id:crypto.randomUUID(),data:d}).then(chk)
  }),
  doc:p=>{const[c,id]=p.split('/');return{set:d=>sb.from('docs').upsert({col:c,id,data:d}).then(chk),delete:()=>sb.from('docs').delete().eq('col',c).eq('id',id).then(chk)}}
};
async function auth(sign){
  const e=$('#ae').value.trim(),p=$('#ap').value,m=$('#am');m.textContent='Aguarde…';
  const r=sign?await sb.auth.signUp({email:e,password:p,options:{data:{codigo:$('#ac').value.trim()}}}):await sb.auth.signInWithPassword({email:e,password:p});
  if(r.error){m.textContent=/Database error/i.test(r.error.message)?'Código da rua incorreto.':r.error.message;return}
  if(!r.data.session){m.textContent='Conta criada! Confirme o e-mail e depois toque em Entrar.';return}
  location.reload();
}
function start(){
  const sub=(c,f)=>db.collection(c).onSnapshot(s=>{f(s.docs.map(d=>Object.assign({id:d.id},dd(d))));sched()});
  sub('profiles',a=>{P={};a.forEach(x=>P[x.id]=x);if(!ready){ready=true;clearTimeout(tmr);if(me&&!P[me])editProf(true)}});
  sub('posts',a=>POSTS=a.sort((x,y)=>y.ts-x.ts));
  sub('likes',a=>LK=a);sub('comments',a=>CM=a);sub('follows',a=>FL=a);sub('saves',a=>SV=a);sub('messages',a=>MS=a);sub('verified',a=>VF=a);
  tmr=setTimeout(()=>{if(!ready){ready=true;render()}},10000);
}
(async()=>{
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  const{data}=await sb.auth.getSession();
  if(!data.session){$('#auth').style.display='flex';return}
  me=data.session.user.id;myEmail=data.session.user.email||'';try{rmute=localStorage.getItem('rsnd')==='0'}catch(e){}start();
})();
</script>
